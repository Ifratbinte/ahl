    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{page.title}}</title>
    <meta name="description" content="{{page.description}}" />
    <meta name="robots" content="{{page.robots}}" />
    <link rel="canonical" href="{{page.url}}" />
    <meta name="theme-color" content="{{site.themeColor}}" />
    <meta name="author" content="{{site.name}}" />

    <!-- Open Graph -->
    <meta property="og:type" content="{{page.ogType}}" />
    <meta property="og:site_name" content="{{site.name}}" />
    <meta property="og:title" content="{{page.title}}" />
    <meta property="og:description" content="{{page.description}}" />
    <meta property="og:url" content="{{page.url}}" />
    <meta property="og:image" content="{{page.ogImageUrl}}" />
    <meta property="og:image:alt" content="{{site.ogImageAlt}}" />
    <meta property="og:locale" content="{{site.locale}}" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{page.title}}" />
    <meta name="twitter:description" content="{{page.description}}" />
    <meta name="twitter:image" content="{{page.ogImageUrl}}" />

    <!-- Icons & PWA manifest -->
    <link rel="icon" href="{{page.root}}assets/images/symbol.png" type="image/png" />
    <link rel="apple-touch-icon" href="{{page.root}}assets/images/symbol.png" />
    <link rel="manifest" href="{{page.root}}site.webmanifest" />
