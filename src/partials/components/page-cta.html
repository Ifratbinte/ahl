<section class="pg-cta" aria-labelledby="pg-cta-title">
  <div class="pg-container">
    <div class="pg-cta-card" data-reveal>
      <div class="pg-cta-glow" aria-hidden="true"></div>
      <div class="pg-eyebrow pg-eyebrow--light">{{cta.eyebrow}}</div>
      <h2 class="pg-cta-title" id="pg-cta-title">{{cta.title}}</h2>
      {{#if cta.text}}<p class="pg-cta-text">{{cta.text}}</p>{{/if}}
      <div class="pg-actions">
        <a class="pg-btn pg-btn--light" href="{{#if cta.primary.href}}{{page.root}}{{cta.primary.href}}{{else}}mailto:{{data.contact.email}}{{/if}}">{{cta.primary.label}}{{"arrow-right" | icon}}</a>
        <a class="pg-btn pg-btn--ghost" href="{{page.root}}{{cta.secondary.href}}">{{cta.secondary.label}}</a>
      </div>
    </div>
  </div>
</section>
