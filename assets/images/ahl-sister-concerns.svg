<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Apex Holdings Limited and its sister concerns</title>
  <desc id="description">Apex Holdings Limited is shown above a connected grid of ten sister companies.</desc>
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0a2540" flood-opacity="0.1" />
    </filter>
    <style>
      .canvas { fill: #f5f8fb; }
      .connector { fill: none; stroke: #a5b5c1; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .parent { fill: #0a2540; }
      .parent-mark { fill: #19b3a6; }
      .parent-acronym { fill: #ffffff; font: 700 19px Manrope, Arial, sans-serif; }
      .parent-kicker { fill: #8edbd3; font: 700 12px Manrope, Arial, sans-serif; }
      .parent-name { fill: #ffffff; font: 700 24px Sora, Manrope, Arial, sans-serif; }
      .card { fill: #ffffff; stroke: #d9e3ea; stroke-width: 1.5; }
      .abbr-bg { fill: #edf3f7; }
      .abbr { font: 700 12px Manrope, Arial, sans-serif; }
      .division { fill: #6b7e8e; font: 700 11px Manrope, Arial, sans-serif; letter-spacing: 1px; }
      .name { fill: #17324a; font: 700 16px Manrope, Arial, sans-serif; }
      .teal { fill: #19b3a6; }
      .textile { fill: #2877a8; }
      .chemical { fill: #8461a8; }
      .apparel { fill: #c94f59; }
      .agro { fill: #4b9255; }
      .food { fill: #d78337; }
    </style>
  </defs>

